                        const year = new Date(d.startDate).getFullYear();
                        return year >= selectedCentury && year < selectedCentury + 100;
                    });
                }
                return filtered;

                const date = new Date(dateStr);
                const year = date.getFullYear();
                let startYear = minYear;
                let endYear = maxYear;

                if (viewMode === "century" && selectedCentury) {
                    startYear = selectedCentury;
                    endYear = selectedCentury + 100;
                }

                return ((year - startYear) / (endYear - startYear)) * 100;
            };

                                                <div style={{
                                                    width: "2px",
                                                    height: "15px",
                                                    background: "#6B7280",
                                                    margin: "0 auto"
                                                }} />
                                                <span style={{
                                                    fontSize: "0.8rem",
                                                    color: "#9CA3AF",
                                                    display: "block",
                                                    marginTop: "5px"
                                                }}>
                                                    {year}
                                                </span>
                                            </div>
                                        );
                                    }
                                    return markers;
                                })()}
                            </div>

                            {/* Event Rows by Group */}
                            {groups.map((group, groupIndex) => {
                                const groupEvents = eventsByGroup[group.name] || [];
                                if (groupEvents.length === 0) return null;

                                // Separate span events from point events
                                const spanEvents = groupEvents.filter(e => e.endDate);
                                const pointEvents = groupEvents.filter(e => !e.endDate);

                                return (
                                    <div key={group.name} style={{ marginBottom: "30px" }}>
                                        <div style={{
                                            color: group.color,
                                            fontSize: "0.9rem",
                                            fontWeight: "600",
                                            marginBottom: "10px",
                                            paddingLeft: "10px",
                                            borderLeft: `3px solid ${group.color}`
                                        }}>
                                            {group.name}
                                        </div>

                                        {/* Span Events (lifespans, periods) */}
                                        {spanEvents.length > 0 && (
                                            <div style={{
                                                position: "relative",
                                                minHeight: `${Math.ceil(spanEvents.length / 3) * 45}px`,
                                                marginBottom: "10px"
                                            }}>
                                                {spanEvents.map((event, idx) => {
                                                    const startPos = getYearPosition(event.startDate);
                                                    const endYear = event.endDate || "2025-01-01";
                                                    const endPos = getYearPosition(endYear);
                                                    const width = Math.max(endPos - startPos, 2);
                                                    const row = idx % 3;

                                                    return (
                                                        <div
                                                            key={idx}
                                                            onMouseEnter={() => setHoveredEvent(event)}
                                                            onMouseLeave={() => setHoveredEvent(null)}
                                                            style={{
                                                                position: "absolute",
                                                                left: `${startPos}%`,
                                                                width: `${width}%`,
                                                                top: `${row * 40}px`,
                                                                height: "30px",
                                                                background: `linear-gradient(90deg, ${event.color}CC, ${event.color}99)`,
                                                                borderRadius: "15px",
                                                                display: "flex",
                                                                alignItems: "center",
                                                                justifyContent: "center",
                                                                padding: "0 10px",
                                                                cursor: "pointer",
                                                                transition: "all 0.2s",
                                                                boxShadow: hoveredEvent === event ? `0 4px 15px ${event.color}50` : "none",
                                                                transform: hoveredEvent === event ? "scale(1.02)" : "scale(1)",
                                                                zIndex: hoveredEvent === event ? 100 : 1
                                                            }}
                                                        >
                                                            <span style={{
                                                                fontSize: "0.75rem",
                                                                color: "white",
                                                                fontWeight: "500",
                                                                whiteSpace: "nowrap",
                                                                overflow: "hidden",
                                                                textOverflow: "ellipsis"
                                                            }}>
                                                                {event.title}
                                                            </span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}

                                        {/* Point Events (publications, etc) */}
                                        {pointEvents.length > 0 && (
                                            <div style={{
                                                position: "relative",
                                                height: "80px"
                                            }}>
                                                {pointEvents.map((event, idx) => {
                                                    const pos = getYearPosition(event.startDate);
                                                    const offset = (idx % 5) * 12;

                                                    return (
                                                        <div
                                                            key={idx}
                                                            onMouseEnter={() => setHoveredEvent(event)}
                                                            onMouseLeave={() => setHoveredEvent(null)}
                                                            style={{
                                                                position: "absolute",
                                                                left: `${pos}%`,
                                                                top: `${offset}px`,
                                                                transform: "translateX(-50%)",
                                                                zIndex: hoveredEvent === event ? 100 : 1
                                                            }}
                                                        >
                                                            <div style={{
                                                                width: hoveredEvent === event ? "14px" : "10px",
                                                                height: hoveredEvent === event ? "14px" : "10px",
                                                                borderRadius: "50%",
                                                                background: event.color,
                                                                border: "2px solid white",
                                                                cursor: "pointer",
                                                                transition: "all 0.2s",
                                                                boxShadow: hoveredEvent === event ? `0 0 15px ${event.color}` : "none"
                                                            }} />
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Hover Tooltip */}
                    {hoveredEvent && (
                        <div style={{
                            position: "fixed",
                            bottom: "20px",
                            left: "50%",
                            transform: "translateX(-50%)",
                            background: "#1F2937",
                            border: `2px solid ${hoveredEvent.color}`,
                            borderRadius: "15px",
                            padding: "15px 25px",
                            boxShadow: `0 10px 40px ${hoveredEvent.color}30`,
                            zIndex: 1000,
                            maxWidth: "90%"
                        }}>
                            <div style={{
                                display: "flex",
                                alignItems: "center",
                                gap: "10px",
                                marginBottom: "8px"
                            }}>
                                <div style={{
                                    width: "8px",
                                    height: "8px",
                                    borderRadius: "50%",
                                    background: hoveredEvent.color
                                }} />
                                <span style={{ fontSize: "0.8rem", color: "#9CA3AF" }}>
                                    {hoveredEvent.group}
                                </span>
                            </div>
                            <h3 style={{
                                fontSize: "1.1rem",
                                color: "white",
                                marginBottom: "5px"
                            }}>
                                {hoveredEvent.title}
                            </h3>
                            <p style={{ color: "#9CA3AF", fontSize: "0.9rem" }}>
                                {new Date(hoveredEvent.startDate).getFullYear()}
                                {hoveredEvent.endDate && ` - ${new Date(hoveredEvent.endDate).getFullYear()}`}
                                {hoveredEvent.detail && ` • ${hoveredEvent.detail}`}
                            </p>
                        </div>
                    )}

                    {/* Footer */}
                    <footer style={{
                        textAlign: "center",
                        marginTop: "40px",
                        padding: "20px",
                        color: "#6B7280",
                        fontSize: "0.85rem"
                    }}>
                        History of Vocal Pedagogy Collaborative Timeline • Created from class data
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<VocalPedagogyTimeline />, document.getElementById('root'));
    </script>
</body>
</html>
