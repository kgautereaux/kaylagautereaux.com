<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>History of Vocal Pedagogy - Vertical Timeline</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #e0e0e0;
            -webkit-tap-highlight-color: transparent;
        }
        #root {
            min-height: 100vh;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        const pedagogues = [
            // === Bel Canto & Empirical Era (1600s – Late 1700s) ===
            { name: "Pier Francesco Tosi", birth: 1654, death: 1732, color: "#4ade80", era: "Bel Canto & Empirical", highlights: "Italian castrato, composer, and author of 'Opinioni de' cantori antichi e moderni' (1723), one of the earliest and most important treatises on singing. Established core bel canto principles including ornamentation, messa di voce, and stylistic expression." },
            { name: "Giambattista Mancini", birth: 1714, death: 1800, color: "#22c55e", era: "Bel Canto & Empirical", highlights: "Italian castrato soprano and singing teacher at the Imperial Court in Vienna. His 'Pensieri e riflessioni pratiche sopra il canto figurato' (1774) bridged Baroque vocal traditions into the Classical era and documented the declining castrati tradition." },
            { name: "Manuel García I", birth: 1775, death: 1832, color: "#16a34a", era: "Bel Canto & Empirical", highlights: "Spanish tenor, composer, and impresario. Patriarch of the García singing dynasty. Created roles in Rossini operas and brought Italian opera to America. Father of Manuel García II, Pauline Viardot, and Maria Malibran." },
            { name: "Nicola Vaccai", birth: 1790, death: 1848, color: "#84cc16", era: "Bel Canto & Empirical", highlights: "Italian composer and singing teacher. His 'Metodo pratico di canto italiano' (1832) remains one of the most widely used vocal methods for teaching Italian style and legato singing to students worldwide." },

            // === Transition & Scientific Revolution (1800 – 1850) ===
            { name: "Manuel García II", birth: 1805, death: 1906, color: "#14b8a6", era: "Transition & Scientific", highlights: "Revolutionary voice scientist who was the first to observe the living vocal folds using a mirror and reflected sunlight (1854). Taught at Paris Conservatory and Royal Academy of Music. His 'Traité complet de l'art du chant' established scientific vocal pedagogy. Lived to 101." },
            { name: "Elizabeth T. Greenfield", birth: 1817, death: 1876, color: "#2dd4bf", era: "Transition & Scientific", highlights: "Known as 'The Black Swan,' she was a pioneering African American concert vocalist in the 1850s. Performed before Queen Victoria in 1853. Overcame racial barriers to become one of the most celebrated singers of her era and an influential teacher." },
            { name: "Francesco Lamperti", birth: 1811, death: 1892, color: "#0d9488", era: "Transition & Scientific", highlights: "Italian vocal pedagogue who defined the 19th-century Italian school of singing. Professor at the Milan Conservatory for over 25 years. His teachings emphasized breath control, appoggio, and the primacy of legato. Teacher of many leading opera singers." },
            { name: "Emma Seiler", birth: 1821, death: 1886, color: "#0891b2", era: "Transition & Scientific", highlights: "German-American voice teacher and researcher. Born in Würzburg, Bavaria, emigrated to the US in 1866. One of the first women to write scientifically about the voice, particularly the register transition. Pioneer in applying scientific principles to voice training in Philadelphia." },
            { name: "Pauline Viardot-García", birth: 1821, death: 1910, color: "#06b6d4", era: "Transition & Scientific", highlights: "Legendary French mezzo-soprano, composer, and teacher. Daughter of Manuel García I, sister of Maria Malibran. Known for extraordinary range and dramatic intensity. Close friend of Chopin, Liszt, and Turgenev. Composed operettas and songs." },
            { name: "Mathilde Marchesi", birth: 1821, death: 1913, color: "#22d3ee", era: "Transition & Scientific", highlights: "German mezzo-soprano and one of the most influential voice teachers in history. Student of Manuel García II. Taught at Vienna Conservatory and her own Paris studio. Primary architect of the bel canto female high soprano. Students included Nellie Melba, Emma Calvé, and Emma Eames." },
            { name: "Giovanni B. Lamperti", birth: 1839, death: 1910, color: "#67e8f9", era: "Transition & Scientific", highlights: "Son of Francesco Lamperti and a renowned voice teacher in his own right. Known for 'Vocal Wisdom,' a collection of his maxims compiled by his student William Earl Brown. Emphasized appoggio and the connection between breath and tone." },
            { name: "Lilli Lehmann", birth: 1848, death: 1929, color: "#0ea5e9", era: "Transition & Scientific", highlights: "German soprano celebrated for her versatility across 170 roles. Created roles in Wagner's Ring Cycle at Bayreuth. Her book 'Meine Gesangskunst' (How to Sing) influenced generations of singers. Taught Geraldine Farrar and Olive Fremstad." },
            { name: "William Shakespeare", birth: 1849, death: 1931, color: "#38bdf8", era: "Transition & Scientific", highlights: "English voice teacher and student of Francesco Lamperti who brought the Italian bel canto style to the English-speaking world. Author of 'The Art of Singing' and 'Plain Words on Singing.' Taught at the Royal Academy of Music in London." },

            // === Institutional & Scientific Era (1850 – 1920) ===
            { name: "E. Azalia Hackley", birth: 1876, death: 1922, color: "#3b82f6", era: "Institutional & Scientific", highlights: "African American soprano, choral conductor, and activist known as the 'vocal teacher of ten thousand.' Pioneered music education for Black communities, organized folk music festivals, and advocated for preserving African American musical heritage." },
            { name: "Herbert Witherspoon", birth: 1873, death: 1935, color: "#6366f1", era: "Institutional & Scientific", highlights: "American bass-baritone who performed leading roles at the Metropolitan Opera. Later served briefly as Met general manager. Author of 'Singing: A Treatise for Teachers and Students.' Early leader of the American Academy of Teachers of Singing." },
            { name: "Estelle Liebling", birth: 1880, death: 1970, color: "#818cf8", era: "Institutional & Scientific", highlights: "American coloratura soprano and voice teacher. Studied with Mathilde Marchesi. Best known as the only teacher of Beverly Sills, whom she taught for over 30 years. Author of 'The Estelle Liebling Vocal Course' and coloratura exercises still used today." },
            { name: "Douglas Stanley", birth: 1890, death: 1964, color: "#7c3aed", era: "Institutional & Scientific", highlights: "Controversial American voice scientist who took a radical, mechanical approach to vocal pedagogy. Applied laboratory methods to voice training and challenged traditional methods. His scientific assertions generated significant debate in the vocal pedagogy community." },
            { name: "Cornelius L. Reid", birth: 1911, death: 2008, color: "#a855f7", era: "Institutional & Scientific", highlights: "American voice teacher and bel canto advocate. Reacted against overly scientific approaches by returning to functional 18th-century principles. His books 'Bel Canto: Principles and Practices,' 'The Free Voice,' and 'Voice: Psyche and Soma' revived interest in historical vocal techniques." },
            { name: "Berton Coffin", birth: 1912, death: 1987, color: "#c084fc", era: "Institutional & Scientific", highlights: "American voice teacher and pioneer of the relationship between vowels and resonance through his phonetic readings approach. His 'Singer's Repertoire' series and 'Sounds of Singing' provided comprehensive resources for matching voice types with appropriate literature." },
            { name: "William Vennard", birth: 1909, death: 1971, color: "#8b5cf6", era: "Institutional & Scientific", highlights: "American voice teacher and pioneer in voice science. Professor at USC. Author of the seminal 'Singing: The Mechanism and the Technic,' which bridged traditional pedagogy with scientific understanding. Known for integrating acoustics and physiology into voice training." },

            // === Modern & Vocology Era (1920 – Present) ===
            { name: "Jo Estill", birth: 1921, death: 2010, color: "#ec4899", era: "Modern & Vocology", highlights: "American singer and voice researcher who revolutionized CCM pedagogy through Estill Voice Training (EVT). Used EMG and other technologies to identify distinct vocal qualities and 'figures' that can be trained independently. Her work bridges classical and contemporary commercial music styles." },
            { name: "Barbara Doscher", birth: 1922, death: 1996, color: "#f43f5e", era: "Modern & Vocology", highlights: "American voice teacher and author of 'The Functional Unity of the Singing Voice.' Professor at University of Colorado Boulder. Known for integrating voice science with practical pedagogy and her work on female voice classification." },
            { name: "Weston Noble", birth: 1922, death: 2016, color: "#fb7185", era: "Modern & Vocology", highlights: "American choral conductor who led the Luther College Nordic Choir for 57 years. Known for his philosophy of 'teaching the whole person' and innovative rehearsal techniques. Received numerous lifetime achievement awards in choral music." },
            { name: "Richard Miller", birth: 1926, death: 2009, color: "#f97316", era: "Modern & Vocology", highlights: "American tenor and preeminent voice pedagogue. Professor at Oberlin Conservatory. The titan of late 20th-century pedagogy and comparative national styles. His books, especially 'The Structure of Singing,' became standard texts." },
            { name: "Seth Riggs", birth: 1930, death: null, color: "#fb923c", era: "Modern & Vocology", highlights: "American vocal coach who developed Speech Level Singing (SLS). Taught over 130 Grammy winners including Michael Jackson, Stevie Wonder, and Natalie Cole. His approach emphasized maintaining a stable larynx and speech-like production throughout the range." },
            { name: "Clifton Ware", birth: 1935, death: null, color: "#fdba74", era: "Modern & Vocology", highlights: "American voice teacher and advocate for a holistic, 'adventuresome' approach to vocal pedagogy. Author of 'Basics of Vocal Pedagogy.' Known for integrating physical, mental, and emotional dimensions into systematic voice training." },
            { name: "Donald Miller", birth: 1933, death: 2020, color: "#e11d48", era: "Modern & Vocology", highlights: "American scientist and co-developer of VoceVista, a pioneering real-time acoustic feedback software for singers and teachers. His work enabled visual analysis of the singing voice, transforming how pedagogues understand resonance, formants, and harmonics." },
            { name: "George Shirley", birth: 1934, death: null, color: "#fbbf24", era: "Modern & Vocology", highlights: "American tenor and the first African American to sing a leading role at the Metropolitan Opera (1961). Distinguished career in opera, concert, and recital. Professor Emeritus at University of Michigan, where he mentored generations of singers." },
            { name: "Meribeth Dayme", birth: 1938, death: null, color: "#facc15", era: "Modern & Vocology", highlights: "Pioneer in integrating bodywork and energy principles into voice science. Founder of CoreSinging method. Her book 'Dynamics of the Singing Voice' combines body awareness, Alexander Technique principles, and voice science for a holistic approach." },
            { name: "Ken Bozeman", birth: 1951, death: null, color: "#a3e635", era: "Modern & Vocology", highlights: "American voice teacher and acoustics expert at Lawrence University. Author of 'Practical Vocal Acoustics' and 'Kinesthetic Voice Pedagogy.' Known for making complex acoustic principles accessible and applicable to everyday voice teaching." },
            { name: "Mary Saunders Barton", birth: 1956, death: null, color: "#4ade80", era: "Modern & Vocology", highlights: "American voice teacher specializing in musical theatre and contemporary commercial music (CCM). Co-author of 'Cross-Training in the Voice Studio.' Faculty at Penn State. Pioneer in legitimizing and systematizing training for non-classical styles." },
            { name: "Joan Melton", birth: 1960, death: null, color: "#34d399", era: "Modern & Vocology", highlights: "American voice and movement specialist. Author of 'Singing in Musical Theatre' and 'One Voice.' Known for integrating movement, breath, and voice work. Faculty at California State University, Fullerton and workshops worldwide." },
            { name: "Lynn Helding", birth: 1960, death: null, color: "#2dd4bf", era: "Modern & Vocology", highlights: "American voice teacher and researcher applying neuroscience to singing. Author of 'The Musician's Mind' and 'Mindful Voice' column for Journal of Singing. Professor at USC Thornton. Pioneer in understanding how the brain learns to sing." },
            { name: "Kari Ragan", birth: 1964, death: null, color: "#22d3d8", era: "Modern & Vocology", highlights: "American voice teacher and leading advocate for evidence-based voice pedagogy. Professor at University of Washington. Author of 'A Systematic Approach to Voice' and the three-part 'Evidence-Based Voice Pedagogy' series. President of NATS 2020-2022." },
            { name: "Cheryl Porter", birth: 1972, death: null, color: "#38bdf8", era: "Modern & Vocology", highlights: "American voice teacher and researcher. Author of 'Dancing with Voice: A Collaborative Journey across Disciplines.' Known for interdisciplinary work connecting voice pedagogy with dance and movement studies." },
            { name: "Felix Graham", birth: 1979, death: null, color: "#818cf8", era: "Modern & Vocology", highlights: "Emerging voice pedagogue and researcher. Contributing to contemporary discussions in vocal pedagogy through research and teaching." },
        ];

        const periods = [
            { name: "Baroque", start: 1600, end: 1750, color: "#22c55e18" },
            { name: "Classical", start: 1750, end: 1820, color: "#06b6d418" },
            { name: "Romantic", start: 1820, end: 1900, color: "#8b5cf618" },
            { name: "Modern / Contemporary", start: 1900, end: 2025, color: "#ec489918" },
        ];

        const publications = [
            { year: 1832, title: "Metodo pratico di canto italiano", author: "Vaccai" },
            { year: 1847, title: "Complete Treatise on Singing", author: "García II" },
            { year: 1880, title: "Une heure d'étude", author: "Viardot-García" },
            { year: 1902, title: "Meine Gesangskunst", author: "Lehmann" },
            { year: 1949, title: "Singing: Mechanism & Technic", author: "Vennard" },
            { year: 1950, title: "Bel Canto: Principles", author: "Reid" },
            { year: 1965, title: "The Free Voice", author: "Reid" },
            { year: 1986, title: "The Structure of Singing", author: "Miller" },
            { year: 1988, title: "Functional Unity of Singing", author: "Doscher" },
            { year: 1988, title: "Estill Voice Training", author: "Estill" },
            { year: 1992, title: "Singing for the Stars", author: "Riggs" },
            { year: 2013, title: "Practical Vocal Acoustics", author: "Bozeman" },
            { year: 2018, title: "Cross-Training in Voice", author: "Saunders Barton" },
            { year: 2020, title: "The Musician's Mind", author: "Helding" },
            { year: 2021, title: "Evidence-Based Pedagogy", author: "Ragan" },
        ];

        const worldEvents = [
            { year: 1760, end: 1840, title: "Industrial Revolution" },
            { year: 1914, end: 1918, title: "World War I" },
            { year: 1939, end: 1945, title: "World War II" },
            { year: 1950, end: 1953, title: "Korean War" },
            { year: 1955, end: 1975, title: "Vietnam War" },
        ];

        function VerticalTimeline() {
            const [selectedPedagogue, setSelectedPedagogue] = useState(null);
            const [selectedPublication, setSelectedPublication] = useState(null);
            const [showPublications, setShowPublications] = useState(true);
            const [showPeriods, setShowPeriods] = useState(true);
            const [showWorldEvents, setShowWorldEvents] = useState(true);
            const [zoomLevel, setZoomLevel] = useState(1);
            const [isMobile, setIsMobile] = useState(false);
            const [showLegend, setShowLegend] = useState(false);
            const [showControls, setShowControls] = useState(false);
            const containerRef = useRef(null);

            // Detect mobile
            useEffect(() => {
                const checkMobile = () => setIsMobile(window.innerWidth < 768);
                checkMobile();
                window.addEventListener('resize', checkMobile);
                return () => window.removeEventListener('resize', checkMobile);
            }, []);

            // Close info panel when tapping outside on mobile
            useEffect(() => {
                if (!isMobile) return;
                const handler = (e) => {
                    if (!e.target.closest('[data-bar]') && !e.target.closest('[data-pub]') && !e.target.closest('[data-info-panel]')) {
                        setSelectedPedagogue(null);
                        setSelectedPublication(null);
                    }
                };
                document.addEventListener('touchstart', handler);
                return () => document.removeEventListener('touchstart', handler);
            }, [isMobile]);

            const minYear = 1650;
            const maxYear = 2025;
            const totalYears = maxYear - minYear;

            const getYearPosition = (year) => ((year - minYear) / totalYears) * 100;

            const basePixelsPerYear = isMobile ? 6 : 8;
            const pixelsPerYear = basePixelsPerYear * zoomLevel;
            const totalHeight = totalYears * pixelsPerYear;

            const yearMarkers = [];
            const interval = isMobile ? 50 : 25;
            for (let year = 1650; year <= 2025; year += interval) {
                yearMarkers.push(year);
            }

            const decadeMarkers = [];
            if (!isMobile) {
                for (let year = 1650; year <= 2025; year += 10) {
                    if (year % 25 !== 0) decadeMarkers.push(year);
                }
            }

            const selectedPedData = selectedPedagogue ? pedagogues.find(p => p.name === selectedPedagogue) : null;

            const handleBarInteraction = (pedName) => {
                if (isMobile) {
                    setSelectedPublication(null);
                    setSelectedPedagogue(prev => prev === pedName ? null : pedName);
                } else {
                    setSelectedPedagogue(pedName);
                }
            };

            const handleBarLeave = () => {
                if (!isMobile) setSelectedPedagogue(null);
            };

            const handlePubInteraction = (pub) => {
                if (isMobile) {
                    setSelectedPedagogue(null);
                    setSelectedPublication(prev => prev === pub ? null : pub);
                } else {
                    setSelectedPublication(pub);
                }
            };

            const handlePubLeave = () => {
                if (!isMobile) setSelectedPublication(null);
            };

            // Button style helper
            const btnStyle = (active) => ({
                padding: isMobile ? "6px 10px" : "4px 12px",
                border: "1px solid #475569",
                borderRadius: "4px",
                background: active ? "#4F46E5" : "#1e293b",
                color: "white",
                cursor: "pointer",
                fontSize: isMobile ? "0.9rem" : "0.85rem",
                minWidth: isMobile ? "36px" : "auto",
                minHeight: isMobile ? "36px" : "auto",
                display: "flex",
                alignItems: "center",
                justifyContent: "center"
            });

            return (
                <div style={{ minHeight: "100vh" }}>
                    {/* Fixed Header */}
                    <header style={{
                        position: "sticky",
                        top: 0,
                        background: "#0f172af0",
                        backdropFilter: "blur(10px)",
                        WebkitBackdropFilter: "blur(10px)",
                        zIndex: 1000,
                        padding: isMobile ? "10px 12px" : "15px 20px",
                        borderBottom: "1px solid #334155"
                    }}>
                        <div style={{ maxWidth: "1400px", margin: "0 auto" }}>
                            <h1 style={{
                                fontSize: isMobile ? "1.1rem" : "1.8rem",
                                background: "linear-gradient(90deg, #22c55e, #3b82f6, #a855f7)",
                                WebkitBackgroundClip: "text",
                                WebkitTextFillColor: "transparent",
                                marginBottom: isMobile ? "8px" : "10px",
                                textAlign: "center"
                            }}>
                                History of Vocal Pedagogy Timeline
                            </h1>

                            {/* Mobile: compact toolbar */}
                            {isMobile ? (
                                <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                                    {/* Row 1: Zoom + toggles */}
                                    <div style={{ display: "flex", justifyContent: "center", alignItems: "center", gap: "8px", flexWrap: "wrap" }}>
                                        <button onClick={() => setZoomLevel(Math.max(0.5, zoomLevel - 0.25))} style={btnStyle()}>−</button>
                                        <span style={{ fontSize: "0.8rem", color: "#94a3b8", minWidth: "40px", textAlign: "center" }}>
                                            {Math.round(zoomLevel * 100)}%
                                        </span>
                                        <button onClick={() => setZoomLevel(Math.min(3, zoomLevel + 0.25))} style={btnStyle()}>+</button>

                                        <div style={{ width: "1px", height: "20px", background: "#475569" }} />

                                        <button
                                            onClick={() => setShowControls(!showControls)}
                                            style={btnStyle(showControls)}
                                        >
                                            Filters {showControls ? "▲" : "▼"}
                                        </button>

                                        <button
                                            onClick={() => setShowLegend(!showLegend)}
                                            style={btnStyle(showLegend)}
                                        >
                                            Legend {showLegend ? "▲" : "▼"}
                                        </button>
                                    </div>

                                    {/* Expandable Filters */}
                                    {showControls && (
                                        <div style={{
                                            display: "flex",
                                            gap: "12px",
                                            justifyContent: "center",
                                            padding: "8px",
                                            background: "#1e293b",
                                            borderRadius: "8px"
                                        }}>
                                            <label style={{ display: "flex", alignItems: "center", gap: "5px", cursor: "pointer" }}>
                                                <input type="checkbox" checked={showPeriods} onChange={(e) => setShowPeriods(e.target.checked)} style={{ accentColor: "#8B5CF6", width: "18px", height: "18px" }} />
                                                <span style={{ fontSize: "0.8rem" }}>Eras</span>
                                            </label>
                                            <label style={{ display: "flex", alignItems: "center", gap: "5px", cursor: "pointer" }}>
                                                <input type="checkbox" checked={showPublications} onChange={(e) => setShowPublications(e.target.checked)} style={{ accentColor: "#F59E0B", width: "18px", height: "18px" }} />
                                                <span style={{ fontSize: "0.8rem" }}>Books</span>
                                            </label>
                                            <label style={{ display: "flex", alignItems: "center", gap: "5px", cursor: "pointer" }}>
                                                <input type="checkbox" checked={showWorldEvents} onChange={(e) => setShowWorldEvents(e.target.checked)} style={{ accentColor: "#EF4444", width: "18px", height: "18px" }} />
                                                <span style={{ fontSize: "0.8rem" }}>World</span>
                                            </label>
                                        </div>
                                    )}

                                    {/* Expandable Legend */}
                                    {showLegend && (
                                        <div style={{
                                            display: "flex",
                                            gap: "12px",
                                            justifyContent: "center",
                                            flexWrap: "wrap",
                                            padding: "8px",
                                            background: "#1e293b",
                                            borderRadius: "8px"
                                        }}>
                                            <div style={{ display: "flex", alignItems: "center", gap: "5px" }}>
                                                <div style={{ width: "16px", height: "10px", background: "linear-gradient(90deg, #22c55e, #a855f7)", borderRadius: "3px", boxShadow: "0 0 4px #a855f740" }} />
                                                <span style={{ fontSize: "0.75rem", color: "#94a3b8" }}>Historical</span>
                                            </div>
                                            <div style={{ display: "flex", alignItems: "center", gap: "5px" }}>
                                                <div style={{ width: "16px", height: "10px", background: "linear-gradient(90deg, #22c55e40, #a855f740)", borderRadius: "3px 3px 0 0", border: "1.5px solid #a855f7cc", borderTopStyle: "dashed" }} />
                                                <span style={{ fontSize: "0.75rem", color: "#94a3b8" }}>Living</span>
                                            </div>
                                            <div style={{ display: "flex", alignItems: "center", gap: "5px" }}>
                                                <div style={{ width: "8px", height: "8px", background: "#f59e0b", borderRadius: "2px", transform: "rotate(45deg)" }} />
                                                <span style={{ fontSize: "0.75rem", color: "#94a3b8" }}>Book</span>
                                            </div>
                                            <div style={{ display: "flex", alignItems: "center", gap: "5px" }}>
                                                <div style={{ width: "6px", height: "10px", background: "#ef4444", borderRadius: "2px", opacity: 0.6 }} />
                                                <span style={{ fontSize: "0.75rem", color: "#94a3b8" }}>War</span>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ) : (
                                /* Desktop controls */
                                <div style={{ display: "flex", flexWrap: "wrap", gap: "15px", justifyContent: "center", alignItems: "center" }}>
                                    <label style={{ display: "flex", alignItems: "center", gap: "6px", cursor: "pointer" }}>
                                        <input type="checkbox" checked={showPeriods} onChange={(e) => setShowPeriods(e.target.checked)} style={{ accentColor: "#8B5CF6" }} />
                                        <span style={{ fontSize: "0.85rem" }}>Music Periods</span>
                                    </label>
                                    <label style={{ display: "flex", alignItems: "center", gap: "6px", cursor: "pointer" }}>
                                        <input type="checkbox" checked={showPublications} onChange={(e) => setShowPublications(e.target.checked)} style={{ accentColor: "#F59E0B" }} />
                                        <span style={{ fontSize: "0.85rem" }}>Publications</span>
                                    </label>
                                    <label style={{ display: "flex", alignItems: "center", gap: "6px", cursor: "pointer" }}>
                                        <input type="checkbox" checked={showWorldEvents} onChange={(e) => setShowWorldEvents(e.target.checked)} style={{ accentColor: "#EF4444" }} />
                                        <span style={{ fontSize: "0.85rem" }}>World Events</span>
                                    </label>

                                    <div style={{ display: "flex", gap: "8px", alignItems: "center", marginLeft: "20px" }}>
                                        <span style={{ fontSize: "0.85rem", color: "#94a3b8" }}>Zoom:</span>
                                        <button onClick={() => setZoomLevel(Math.max(0.5, zoomLevel - 0.25))} style={btnStyle()}>−</button>
                                        <span style={{ minWidth: "50px", textAlign: "center", fontSize: "0.85rem" }}>{Math.round(zoomLevel * 100)}%</span>
                                        <button onClick={() => setZoomLevel(Math.min(3, zoomLevel + 0.25))} style={btnStyle()}>+</button>
                                    </div>

                                    <div style={{ width: "1px", height: "24px", background: "#475569" }} />

                                    <button
                                        onClick={() => {
                                            const w = window.open('', '_blank', 'width=1200,height=900,scrollbars=yes,resizable=yes,menubar=no,toolbar=no,location=no');
                                            if (w) {
                                                w.document.write('<!DOCTYPE html>' + document.documentElement.outerHTML);
                                                w.document.close();
                                            } else {
                                                alert('Pop-up was blocked. Please allow pop-ups for this site and try again.');
                                            }
                                        }}
                                        style={{
                                            padding: "6px 14px",
                                            border: "1px solid #475569",
                                            borderRadius: "6px",
                                            background: "#1e293b",
                                            color: "#94a3b8",
                                            cursor: "pointer",
                                            fontSize: "0.85rem",
                                            display: "flex",
                                            alignItems: "center",
                                            gap: "6px"
                                        }}
                                        title="Open in new resizable window"
                                    >
                                        <span style={{ fontSize: "1rem" }}>↗</span> Open in New Window
                                    </button>
                                </div>
                            )}
                        </div>
                    </header>

                    {/* Tip for mobile */}
                    {isMobile && (
                        <div style={{
                            textAlign: "center",
                            padding: "6px",
                            fontSize: "0.7rem",
                            color: "#64748b",
                            background: "#0f172a"
                        }}>
                            Tap a bar to see details • Scroll to explore
                        </div>
                    )}

                    {/* Main Timeline */}
                    <div style={{
                        display: "flex",
                        maxWidth: "1400px",
                        margin: "0 auto",
                        padding: isMobile ? "10px 5px" : "20px",
                        overflowX: isMobile ? "auto" : "visible"
                    }}>
                        {/* Year axis */}
                        <div style={{
                            width: isMobile ? "40px" : "60px",
                            flexShrink: 0,
                            position: "relative",
                            height: `${totalHeight}px`
                        }}>
                            {yearMarkers.map(year => (
                                <div key={year} style={{
                                    position: "absolute",
                                    bottom: `${getYearPosition(year)}%`,
                                    right: "3px",
                                    transform: "translateY(50%)",
                                    fontSize: isMobile ? "0.65rem" : "0.75rem",
                                    color: "#94a3b8",
                                    fontWeight: "600"
                                }}>
                                    {year}
                                </div>
                            ))}
                            {!isMobile && zoomLevel >= 1 && decadeMarkers.map(year => (
                                <div key={year} style={{
                                    position: "absolute",
                                    bottom: `${getYearPosition(year)}%`,
                                    right: "5px",
                                    transform: "translateY(50%)",
                                    fontSize: "0.65rem",
                                    color: "#64748b"
                                }}>
                                    {year}
                                </div>
                            ))}
                        </div>

                        {/* Timeline content */}
                        <div
                            ref={containerRef}
                            style={{
                                flex: 1,
                                position: "relative",
                                height: `${totalHeight}px`,
                                borderLeft: "2px solid #475569",
                                minWidth: isMobile ? `${pedagogues.length * 18}px` : "auto"
                            }}
                        >
                            {/* Grid lines */}
                            {yearMarkers.map(year => (
                                <div key={`grid-${year}`} style={{
                                    position: "absolute",
                                    bottom: `${getYearPosition(year)}%`,
                                    left: 0, right: 0,
                                    height: "1px",
                                    background: "#334155",
                                    zIndex: 0
                                }} />
                            ))}

                            {/* Music Periods */}
                            {showPeriods && periods.map(period => (
                                <div key={period.name} style={{
                                    position: "absolute",
                                    bottom: `${getYearPosition(period.start)}%`,
                                    height: `${getYearPosition(period.end) - getYearPosition(period.start)}%`,
                                    left: 0, right: 0,
                                    background: period.color,
                                    zIndex: 0
                                }}>
                                    <span style={{
                                        position: "absolute",
                                        left: isMobile ? "4px" : "10px",
                                        top: "50%",
                                        transform: "translateY(-50%)",
                                        fontSize: isMobile ? "0.55rem" : "0.7rem",
                                        color: "#94a3b8",
                                        fontStyle: "italic",
                                        writingMode: "vertical-rl",
                                        textOrientation: "mixed",
                                        opacity: 0.7
                                    }}>
                                        {period.name}
                                    </span>
                                </div>
                            ))}

                            {/* World Events */}
                            {showWorldEvents && worldEvents.map(event => (
                                <div key={event.title} style={{
                                    position: "absolute",
                                    bottom: `${getYearPosition(event.year)}%`,
                                    height: `${getYearPosition(event.end) - getYearPosition(event.year)}%`,
                                    right: isMobile ? "4px" : "10px",
                                    width: isMobile ? "6px" : "8px",
                                    background: "linear-gradient(180deg, #ef444480, #ef444440)",
                                    borderRadius: "4px",
                                    zIndex: 5
                                }} title={`${event.title} (${event.year}-${event.end})`}>
                                    {!isMobile && (
                                        <span style={{
                                            position: "absolute",
                                            right: "15px",
                                            top: "50%",
                                            transform: "translateY(-50%)",
                                            fontSize: "0.65rem",
                                            color: "#f87171",
                                            whiteSpace: "nowrap"
                                        }}>
                                            {event.title}
                                        </span>
                                    )}
                                </div>
                            ))}

                            {/* Pedagogue Lifespans */}
                            <div style={{
                                position: "absolute",
                                left: isMobile ? "20px" : "40px",
                                right: isMobile ? "15px" : "120px",
                                top: 0, bottom: 0,
                                display: "flex",
                                gap: isMobile ? "1px" : "3px"
                            }}>
                                {pedagogues.map((ped, idx) => {
                                    const deathYear = ped.death || 2025;
                                    const isAlive = !ped.death;
                                    const isSelected = selectedPedagogue === ped.name;

                                    return (
                                        <div key={ped.name} style={{
                                            position: "relative",
                                            flex: 1,
                                            minWidth: isMobile ? "14px" : "20px"
                                        }}>
                                            <div
                                                data-bar="true"
                                                onClick={() => handleBarInteraction(ped.name)}
                                                onMouseEnter={() => !isMobile && handleBarInteraction(ped.name)}
                                                onMouseLeave={handleBarLeave}
                                                style={{
                                                    position: "absolute",
                                                    bottom: `${getYearPosition(ped.birth)}%`,
                                                    height: `${getYearPosition(deathYear) - getYearPosition(ped.birth)}%`,
                                                    left: "1px",
                                                    right: "1px",
                                                    background: isAlive
                                                        ? (isSelected
                                                            ? `linear-gradient(180deg, ${ped.color}99, ${ped.color}66)`
                                                            : `linear-gradient(180deg, ${ped.color}66, ${ped.color}40)`)
                                                        : (isSelected
                                                            ? `linear-gradient(180deg, ${ped.color}, ${ped.color}dd)`
                                                            : `linear-gradient(180deg, ${ped.color}, ${ped.color}bb)`),
                                                    borderRadius: isAlive ? "6px 6px 0 0" : "6px",
                                                    cursor: "pointer",
                                                    transition: "all 0.2s",
                                                    boxShadow: isSelected
                                                        ? `0 0 20px ${ped.color}60`
                                                        : (!isAlive ? `0 0 8px ${ped.color}40, inset 0 0 8px ${ped.color}20` : "none"),
                                                    transform: isSelected ? "scaleX(1.3)" : "scaleX(1)",
                                                    zIndex: isSelected ? 100 : 10,
                                                    borderTop: isAlive ? `3px dashed ${ped.color}` : "none",
                                                    border: isAlive
                                                        ? `2px solid ${ped.color}cc`
                                                        : "none",
                                                    borderTopStyle: isAlive ? "dashed" : "none"
                                                }}
                                            >
                                                {/* Name label */}
                                                <div style={{
                                                    position: "absolute",
                                                    left: "50%",
                                                    top: "50%",
                                                    transform: "translate(-50%, -50%) rotate(-90deg)",
                                                    whiteSpace: "nowrap",
                                                    fontSize: isSelected ? (isMobile ? "0.6rem" : "0.75rem") : (isMobile ? "0.5rem" : "0.65rem"),
                                                    fontWeight: isSelected ? "600" : "400",
                                                    color: "white",
                                                    textShadow: "0 1px 3px rgba(0,0,0,0.5)",
                                                    opacity: isSelected ? 1 : 0.9,
                                                    transition: "all 0.2s"
                                                }}>
                                                    {ped.name}
                                                </div>

                                                {/* Birth year */}
                                                <div style={{
                                                    position: "absolute",
                                                    bottom: "-18px",
                                                    left: "50%",
                                                    transform: "translateX(-50%)",
                                                    fontSize: "0.55rem",
                                                    color: ped.color,
                                                    opacity: isSelected ? 1 : 0,
                                                    transition: "opacity 0.2s"
                                                }}>
                                                    {ped.birth}
                                                </div>

                                                {/* Death year */}
                                                {!isAlive && (
                                                    <div style={{
                                                        position: "absolute",
                                                        top: "-18px",
                                                        left: "50%",
                                                        transform: "translateX(-50%)",
                                                        fontSize: "0.55rem",
                                                        color: ped.color,
                                                        opacity: isSelected ? 1 : 0,
                                                        transition: "opacity 0.2s"
                                                    }}>
                                                        {ped.death}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* Publications */}
                            {showPublications && publications.map((pub, idx) => (
                                <div
                                    key={`${pub.year}-${pub.title}`}
                                    data-pub="true"
                                    onClick={() => handlePubInteraction(pub)}
                                    onMouseEnter={() => !isMobile && handlePubInteraction(pub)}
                                    onMouseLeave={handlePubLeave}
                                    style={{
                                        position: "absolute",
                                        bottom: `${getYearPosition(pub.year)}%`,
                                        left: isMobile ? "8px" : "20px",
                                        width: isMobile ? "10px" : "12px",
                                        height: isMobile ? "10px" : "12px",
                                        background: selectedPublication === pub ? "#fbbf24" : "#f59e0b",
                                        borderRadius: "2px",
                                        transform: "rotate(45deg)",
                                        cursor: "pointer",
                                        zIndex: 50,
                                        boxShadow: selectedPublication === pub ? "0 0 15px #fbbf24" : "none",
                                        transition: "all 0.2s"
                                    }}
                                    title={`${pub.title} - ${pub.author} (${pub.year})`}
                                />
                            ))}
                        </div>
                    </div>

                    {/* Info Panel */}
                    {(selectedPedData || selectedPublication) && (
                        <div
                            data-info-panel="true"
                            style={{
                                position: "fixed",
                                bottom: isMobile ? "0" : "20px",
                                left: isMobile ? "0" : "50%",
                                right: isMobile ? "0" : "auto",
                                transform: isMobile ? "none" : "translateX(-50%)",
                                background: "#1e293b",
                                border: selectedPedData ? `2px solid ${selectedPedData.color}` : "2px solid #f59e0b",
                                borderRadius: isMobile ? "16px 16px 0 0" : "16px",
                                padding: isMobile ? "16px 16px 20px" : "20px 25px",
                                boxShadow: "0 -5px 40px rgba(0,0,0,0.5)",
                                zIndex: 2000,
                                maxWidth: isMobile ? "100%" : "600px",
                                width: isMobile ? "100%" : "90%",
                                maxHeight: isMobile ? "45vh" : "auto",
                                overflowY: "auto"
                            }}
                        >
                            {/* Close button on mobile */}
                            {isMobile && (
                                <button
                                    onClick={() => { setSelectedPedagogue(null); setSelectedPublication(null); }}
                                    style={{
                                        position: "absolute",
                                        top: "10px",
                                        right: "12px",
                                        background: "none",
                                        border: "none",
                                        color: "#94a3b8",
                                        fontSize: "1.4rem",
                                        cursor: "pointer",
                                        padding: "4px 8px"
                                    }}
                                >
                                    ✕
                                </button>
                            )}

                            {selectedPedData && (() => {
                                const deathYear = selectedPedData.death || "Present";
                                const lifespan = (selectedPedData.death || 2025) - selectedPedData.birth;
                                return (
                                    <div>
                                        <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "10px", paddingRight: isMobile ? "30px" : "0" }}>
                                            <div style={{ width: "16px", height: "16px", borderRadius: "5px", background: selectedPedData.color, flexShrink: 0 }} />
                                            <h3 style={{ fontSize: isMobile ? "1.1rem" : "1.3rem", color: "white", margin: 0 }}>
                                                {selectedPedData.name}
                                            </h3>
                                        </div>
                                        <p style={{ color: selectedPedData.color, fontSize: isMobile ? "0.85rem" : "0.95rem", marginBottom: "10px", fontWeight: "500" }}>
                                            {selectedPedData.birth} – {deathYear} &nbsp;•&nbsp; {lifespan} years
                                        </p>
                                        <p style={{ color: "#cbd5e1", fontSize: isMobile ? "0.82rem" : "0.9rem", lineHeight: "1.6", margin: 0 }}>
                                            {selectedPedData.highlights}
                                        </p>
                                    </div>
                                );
                            })()}
                            {selectedPublication && (
                                <div>
                                    <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "8px", paddingRight: isMobile ? "30px" : "0" }}>
                                        <div style={{ width: "12px", height: "12px", borderRadius: "3px", background: "#f59e0b", transform: "rotate(45deg)", flexShrink: 0 }} />
                                        <span style={{ fontSize: "0.85rem", color: "#fbbf24" }}>Major Publication</span>
                                    </div>
                                    <h3 style={{ fontSize: isMobile ? "1rem" : "1.2rem", color: "white", marginBottom: "6px" }}>
                                        {selectedPublication.title}
                                    </h3>
                                    <p style={{ color: "#94a3b8", fontSize: isMobile ? "0.85rem" : "0.95rem", margin: 0 }}>
                                        {selectedPublication.author} &nbsp;•&nbsp; {selectedPublication.year}
                                    </p>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Desktop Legend */}
                    {!isMobile && (
                        <div style={{
                            position: "fixed",
                            top: "120px",
                            right: "20px",
                            background: "#1e293bee",
                            borderRadius: "10px",
                            padding: "15px",
                            fontSize: "0.75rem",
                            zIndex: 500,
                            border: "1px solid #334155"
                        }}>
                            <div style={{ fontWeight: "600", marginBottom: "10px", color: "#e2e8f0" }}>Legend</div>
                            <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                                <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                                    <div style={{ width: "20px", height: "12px", background: "linear-gradient(90deg, #22c55e, #a855f7)", borderRadius: "3px", boxShadow: "0 0 6px #a855f740" }} />
                                    <span style={{ color: "#94a3b8" }}>Historical Pedagogue</span>
                                </div>
                                <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                                    <div style={{ width: "20px", height: "12px", background: "linear-gradient(90deg, #22c55e40, #a855f740)", borderRadius: "3px 3px 0 0", border: "1.5px solid #a855f7cc", borderTopStyle: "dashed" }} />
                                    <span style={{ color: "#94a3b8" }}>Living Pedagogue</span>
                                </div>
                                <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                                    <div style={{ width: "10px", height: "10px", background: "#f59e0b", borderRadius: "2px", transform: "rotate(45deg)" }} />
                                    <span style={{ color: "#94a3b8" }}>Publication</span>
                                </div>
                                <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                                    <div style={{ width: "8px", height: "12px", background: "#ef4444", borderRadius: "2px", opacity: 0.6 }} />
                                    <span style={{ color: "#94a3b8" }}>World Event</span>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Desktop Instructions */}
                    {!isMobile && (
                        <div style={{
                            position: "fixed",
                            bottom: "20px",
                            right: "20px",
                            background: "#1e293bee",
                            borderRadius: "10px",
                            padding: "12px 15px",
                            fontSize: "0.7rem",
                            color: "#64748b",
                            zIndex: 500,
                            border: "1px solid #334155"
                        }}>
                            <div style={{ marginBottom: "5px" }}>↑ Recent dates at top</div>
                            <div>↓ Earlier dates at bottom</div>
                            <div style={{ marginTop: "8px", color: "#94a3b8" }}>Hover over bars for details</div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<VerticalTimeline />, document.getElementById('root'));
    </script>
</body>
</html>
